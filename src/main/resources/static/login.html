<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustProof - Secure Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #070a13;
            --panel-bg: rgba(15, 23, 42, 0.8);
            --neon-cyan: #00f2fe;
            --neon-green: #00ff87;
            --text-light: #e2e8f0;
            --border-glow: rgba(0, 242, 254, 0.25);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(var(--border-glow) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-glow) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-light);
            margin: 0;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .login-container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            padding: 40px; border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1);
            width: 100%; max-width: 400px; text-align: center;
        }

        h2 {
            color: var(--neon-cyan); border-bottom: 1px dashed var(--neon-cyan);
            padding-bottom: 15px; margin-bottom: 30px;
            font-family: 'Share Tech Mono', monospace; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,242,254,0.3);
        }

        .form-group { margin-bottom: 20px; text-align: left; }

        label {
            font-family: 'Share Tech Mono', monospace;
            color: #94a3b8; font-size: 14px; display: block; margin-bottom: 5px;
        }

        input {
            width: 100%; padding: 12px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-glow);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px; border-radius: 4px; box-sizing: border-box;
            transition: 0.3s ease;
        }
        input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: inset 0 0 15px rgba(0,242,254,0.2); }

        button {
            font-family: 'Share Tech Mono', monospace; background: transparent;
            color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
            padding: 12px; border-radius: 4px; cursor: pointer;
            font-size: 18px; width: 100%; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 2px; margin-top: 10px;
        }
        button:hover { background: rgba(0, 242, 254, 0.1); box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }

        #error-msg {
            color: #ff2a5f; margin-top: 20px; font-size: 14px; display: none;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 10px rgba(255,42,95,0.4);
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>> SECURE_AUTH_NODE</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>ADMIN_ID</label>
            <input type="text" id="username" required placeholder="Enter ID...">
        </div>
        <div class="form-group">
            <label>PASS_KEY</label>
            <input type="password" id="password" required placeholder="Enter Key...">
        </div>
        <button type="submit">INITIATE LOGIN</button>
    </form>
    <div id="error-msg">[ ERROR: ACCESS DENIED ]</div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("error-msg");

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                window.location.href = "/admin-dashboard.html";
            } else {
                const data = await response.json();
                errorMsg.innerText = "[ ERROR: " + (data.message || "ACCESS DENIED").toUpperCase() + " ]";
                errorMsg.style.display = "block";
            }
        } catch (err) {
            errorMsg.innerText = "[ FATAL: NODE OFFLINE ]";
            errorMsg.style.display = "block";
        }
    });
</script>
</body>
</html>
