<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustProof | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyber-blue: #00f3ff; --dark-bg: #090b10; --panel-bg: rgba(13, 17, 25, 0.85); --text-main: #e2e8f0; --text-muted: #64748b; }
        body { margin: 0; padding: 0; background-color: var(--dark-bg); background-image: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05), transparent 60%); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .login-card { background: var(--panel-bg); border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: 0 0 40px rgba(0, 243, 255, 0.08); border-radius: 8px; padding: 40px; width: 100%; max-width: 400px; backdrop-filter: blur(12px); position: relative; }
        .login-card h1 { font-family: 'Rajdhani', sans-serif; color: #fff; text-align: center; font-size: 28px; margin-bottom: 5px; letter-spacing: 1px; }
        .login-card p { color: var(--cyber-blue); text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px 15px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; color: #fff; font-size: 14px; box-sizing: border-box; transition: all 0.3s ease; }
        input:focus { outline: none; border-color: var(--cyber-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        button { width: 100%; padding: 14px; background: transparent; color: var(--cyber-blue); border: 1px solid var(--cyber-blue); border-radius: 4px; font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        button:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }

       /* Force the display override */
.error-msg {
    color: #ff3366;
    font-size: 12px;
    text-align: center;
    margin-top: 15px;
    display: none;
    font-weight: bold;
    border: 1px solid #ff3366;
    padding: 10px;
    border-radius: 4px;
    background: rgba(255, 51, 102, 0.1);
}
         </style>
</head>
<body>
<div class="login-card">
    <h1>SSMRV PORTAL</h1>
    <p>Authorized Personnel Only</p>
    <form action="/api/certificate/login" method="POST">
        <div class="input-group">
            <label for="username">Admin Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>
        <div class="input-group">
            <label for="password">Security Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit">Authenticate Session</button>
        <!-- Error Message Div -->
        <div id="errorAlert" class="error-msg">INVALID CREDENTIALS. ACCESS DENIED.</div>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const errorAlert = document.getElementById('errorAlert');

    if (urlParams.has('error')) {
        if (errorAlert) {
            errorAlert.style.setProperty('display', 'block', 'important');
        }
    }
</script>
</body>
</html>
