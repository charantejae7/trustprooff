<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustProof - Cyber Command Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #070a13;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --neon-cyan: #00f2fe;
            --neon-green: #00ff87;
            --neon-red: #ff2a5f;
            --text-light: #e2e8f0;
            --border-glow: rgba(0, 242, 254, 0.25);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            /* Cyber Grid Background */
            background-image:
                linear-gradient(var(--border-glow) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-glow) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-light);
            margin: 0;
            padding: 30px;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-bottom: 3px solid var(--neon-cyan);
            padding: 20px 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .header h2 {
            margin: 0;
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0,242,254,0.4);
            letter-spacing: 2px;
        }

        .sys-admin {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-green);
            letter-spacing: 1px;
        }

        .container { display: flex; gap: 25px; flex-wrap: wrap; }

        .form-section, .table-section {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            padding: 30px;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.05);
        }
        .form-section { flex: 1; min-width: 320px; }
        .table-section { flex: 2; min-width: 550px; }

        h3 {
            margin-top: 0;
            color: var(--text-light);
            border-bottom: 1px dashed var(--neon-cyan);
            padding-bottom: 15px;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
        }

        label {
            font-family: 'Share Tech Mono', monospace;
            color: #94a3b8;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-glow);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            border-radius: 4px; box-sizing: border-box;
            transition: 0.3s ease;
        }
        input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }

        button {
            font-family: 'Share Tech Mono', monospace;
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 12px 20px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s; width: 100%; font-size: 16px;
        }
        button:hover { background: rgba(0, 255, 135, 0.1); box-shadow: 0 0 15px rgba(0, 255, 135, 0.4); }

        .btn-danger { color: var(--neon-red); border-color: var(--neon-red); width: auto; font-size: 14px;}
        .btn-danger:hover { background: rgba(255, 42, 95, 0.1); box-shadow: 0 0 15px rgba(255, 42, 95, 0.4); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-family: 'Share Tech Mono', monospace; font-size: 15px;}
        th, td { padding: 15px 12px; text-align: left; border-bottom: 1px solid rgba(0, 242, 254, 0.15); }
        th { color: var(--neon-cyan); text-transform: uppercase; font-size: 14px;}

        .btn-download { color: var(--neon-cyan); border-color: var(--neon-cyan); width: auto; font-size: 12px; padding: 6px 12px; }
        .btn-download:hover { background: rgba(0, 242, 254, 0.1); box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
    </style>
</head>
<body>

<div class="header">
    <h2>TRUSTPROOF // SSMRV CYBER NODE</h2>
    <div class="sys-admin">[SYS.ADMIN: CHARAN] // ACTIVE</div>
    <button class="btn-danger" onclick="window.location.href='/login.html'">TERMINATE_SESSION</button>
</div>

<div class="container">
    <!-- Add Student Form -->
    <div class="form-section">
        <h3>> Initialize Secure Record</h3>
        <form id="studentForm">
            <label>TARGET_NAME</label>
            <input type="text" id="name" required placeholder="Enter student name...">

            <label>PROGRAM_NODE</label>
            <input type="text" id="course" required value="BCA">

            <label>ACADEMIC_METRIC (CGPA)</label>
            <input type="text" id="cgpa" required placeholder="e.g. 9.5">

            <button type="submit">EXECUTE ENCRYPTION & SAVE</button>
        </form>
    </div>

    <!-- Student Database Table -->
    <div class="table-section">
        <h3>> Supabase Databank Registry</h3>
        <table>
            <thead>
            <tr>
                <th>UUID</th>
                <th>Name</th>
                <th>Course</th>
                <th>CGPA</th>
                <th>Export</th>
            </tr>
            </thead>
            <tbody id="studentTableBody">
            <!-- Data will load here automatically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadStudents() {
        try {
            const response = await fetch('/api/students');
            const students = await response.json();
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            students.forEach(student => {
                tbody.innerHTML += `
                    <tr>
                        <td style="color: #64748b;">#00${student.id}</td>
                        <td style="color: #e2e8f0;">${student.name}</td>
                        <td style="color: #94a3b8;">${student.course}</td>
                        <td style="color: var(--neon-green);">${student.cgpa}</td>
                        <td>
                            <button class="btn-download" onclick="downloadPdf(${student.id})">COMPILE_PDF</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Failed to load records.");
        }
    }

    document.getElementById("studentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const course = document.getElementById("course").value;
        const cgpa = document.getElementById("cgpa").value;

        await fetch('/api/students/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, course, cgpa })
        });

        document.getElementById("studentForm").reset();
        document.getElementById("course").value = "BCA";
        loadStudents();
    });

    function downloadPdf(studentId) {
        window.open(`/api/students/${studentId}/pdf`, '_blank');
    }

    loadStudents();
</script>
</body>
</html>
