<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustProof | Verification Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyber-blue: #00f3ff; --dark-bg: #090b10; --panel-bg: rgba(13, 17, 25, 0.85); --text-main: #e2e8f0; --text-muted: #64748b; }
        body { margin: 0; padding: 0; background-color: var(--dark-bg); background-image: radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.08), transparent 25%); background-attachment: fixed; font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        body::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; }
        .dashboard { background: var(--panel-bg); border: 1px solid rgba(0, 243, 255, 0.15); box-shadow: 0 0 30px rgba(0, 243, 255, 0.05), inset 0 0 20px rgba(0, 0, 0, 0.5); border-radius: 8px; padding: 45px 40px; width: 100%; max-width: 500px; backdrop-filter: blur(12px); position: relative; }
        .dashboard::before { content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 60%; height: 2px; background: linear-gradient(90deg, transparent, var(--cyber-blue), transparent); }
        .corner { position: absolute; width: 12px; height: 12px; border: 2px solid var(--cyber-blue); opacity: 0.7; }
        .tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .br { bottom: 15px; right: 15px; border-left: none; border-top: none; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-family: 'Rajdhani', sans-serif; color: #ffffff; margin: 0 0 5px 0; font-size: 34px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .header p { color: var(--cyber-blue); margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
        label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        textarea { width: 100%; height: 150px; padding: 12px 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; color: #00f3ff; font-size: 13px; font-family: monospace; box-sizing: border-box; resize: none; transition: all 0.3s ease; }
        textarea:focus { outline: none; border-color: var(--cyber-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); background: rgba(0, 243, 255, 0.03); }
        button { width: 100%; padding: 15px; background: transparent; color: var(--cyber-blue); border: 1px solid var(--cyber-blue); border-radius: 4px; font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; margin-top: 20px; }
        button:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="corner tl"></div>
    <div class="corner br"></div>

    <div class="header">
        <h1>TrustProof AUDIT</h1>
        <p>Employer Verification Terminal</p>
    </div>

    <form action="/api/certificate/verify-scan" method="POST">
        <label for="scannedData">Paste Scanned QR Code Data Below</label>
        <textarea id="scannedData" name="scannedData" placeholder="DATA:
Name: ...
Course: ...
CGPA: ...

SIGNATURE:
[Encrypted Hash]" required></textarea>

        <button type="submit">Run Cryptographic Audit</button>
    </form>
</div>

</body>
</html>
