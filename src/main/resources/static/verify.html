<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustProof - Verify Certificate</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 160px; margin: 10px 0; padding: 10px; font-family: monospace; }
        button { background-color: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; }
        button:hover { background-color: #0369a1; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 6px; display: none; }
        .success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .failure { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<h2>TrustProof Certificate Verification</h2>
<p>Paste the full QR code output (Data + Signature) below:</p>

<textarea id="rawQrInput" placeholder="DATA:&#10;Name: ...&#10;SIGNATURE:&#10;..."></textarea>
<button type="button" onclick="verifyQrData()">Verify Certificate</button>

<div id="resultContainer" class="result-box"></div>

<script>
    async function verifyQrData() {
        const rawText = document.getElementById("rawQrInput").value.trim();
        const resultBox = document.getElementById("resultContainer");

        if (!rawText) {
            alert("Please paste the scanned QR code content.");
            return;
        }

        try {
            const response = await fetch("/api/verify-certificate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ qrText: rawText })
            });

            const data = await response.json();
            resultBox.style.display = "block";

            if (data.status === "VALID") {
                resultBox.className = "result-box success";
                resultBox.innerHTML = `<strong>✅ ${data.message}</strong><br><br><strong>Verified Payload:</strong><br><pre>${data.verifiedData}</pre>`;
            } else {
                resultBox.className = "result-box failure";
                resultBox.innerHTML = `<strong>❌ ${data.message}</strong>`;
            }
        } catch (err) {
            resultBox.style.display = "block";
            resultBox.className = "result-box failure";
            resultBox.innerHTML = `<strong>❌ Connection Error:</strong> Unable to reach verification service.`;
        }
    }
</script>
</body>
</html>
