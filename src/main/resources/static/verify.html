<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustProof - Cryptographic Scanner</title>

    <!-- Camera Scanning Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- PDF & Invisible QR Extraction Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #070a13;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --neon-cyan: #00f2fe;
            --neon-green: #00ff87;
            --neon-red: #ff2a5f;
            --text-light: #e2e8f0;
            --border-glow: rgba(0, 242, 254, 0.25);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.05) 0%, transparent 60%);
            color: var(--text-light);
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .verify-container {
            width: 100%; max-width: 650px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            padding: 40px; border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.08);
        }

        h2 {
            color: var(--neon-cyan); border-bottom: 1px dashed var(--neon-cyan);
            padding-bottom: 15px; margin-bottom: 25px; text-align: center;
            font-family: 'Share Tech Mono', monospace; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,242,254,0.3);
        }

        #reader {
            width: 100%; margin-bottom: 20px; border: 1px solid var(--neon-cyan);
            border-radius: 4px; overflow: hidden; display: none;
            box-shadow: inset 0 0 20px rgba(0,242,254,0.2);
        }
        #reader video { width: 100%; }

        textarea {
            width: 100%; height: 120px; padding: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-glow);
            color: var(--neon-cyan); border-radius: 4px;
            box-sizing: border-box; resize: vertical; margin-bottom: 20px;
            font-family: 'Share Tech Mono', monospace; font-size: 12px;
            line-height: 1.5; transition: 0.3s ease;
        }

        /* Upgraded Button Layout */
        .btn-group { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }

        button {
            font-family: 'Share Tech Mono', monospace; background: transparent;
            color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
            padding: 12px; border-radius: 4px; cursor: pointer;
            font-size: 14px; flex: 1; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
            min-width: 180px;
        }

        button:hover { background: rgba(0, 242, 254, 0.1); box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }

        .btn-scan { color: var(--neon-green); border-color: var(--neon-green); }
        .btn-scan:hover { background: rgba(0, 255, 135, 0.1); box-shadow: 0 0 20px rgba(0, 255, 135, 0.4); }

        .btn-upload { color: #a855f7; border-color: #a855f7; }
        .btn-upload:hover { background: rgba(168, 85, 247, 0.1); box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }

        .result-box {
            margin-top: 20px; padding: 20px; border-radius: 4px;
            display: none; text-align: center; font-size: 20px;
            font-family: 'Share Tech Mono', monospace; letter-spacing: 1px;
            border: 1px solid transparent;
        }
        .valid {
            background-color: rgba(0, 255, 135, 0.05); color: var(--neon-green);
            border-color: var(--neon-green); box-shadow: 0 0 20px rgba(0,255,135,0.2);
            text-shadow: 0 0 10px rgba(0,255,135,0.5);
        }
        .invalid {
            background-color: rgba(255, 42, 95, 0.05); color: var(--neon-red);
            border-color: var(--neon-red); box-shadow: 0 0 20px rgba(255,42,95,0.2);
            text-shadow: 0 0 10px rgba(255,42,95,0.5);
        }

        .verified-data {
            margin-top: 20px; font-size: 15px; color: var(--text-light);
            text-align: left; background: rgba(0,0,0,0.5);
            padding: 20px; border-radius: 4px; border: 1px dashed var(--neon-green);
        }
    </style>
</head>
<body>

<div class="verify-container">
    <h2>> Cryptographic Scanner</h2>

    <div id="reader"></div>

    <div class="btn-group">
        <!-- Camera Scanner -->
        <button class="btn-scan" id="startScanBtn">> INITIATE OPTICS</button>
        <button class="btn-scan" id="stopScanBtn" style="display:none; color: var(--neon-red); border-color: var(--neon-red);">> TERMINATE OPTICS</button>

        <!-- NEW: PDF Upload -->
        <button class="btn-upload" id="uploadPdfBtn">> UPLOAD PDF TO VERIFY</button>
        <input type="file" id="pdfFileInput" accept="application/pdf" style="display: none;">
    </div>

    <form id="verifyForm">
        <textarea id="qrContent" placeholder="AWAITING INPUT... PASTE SECURE HASH OR SCAN/UPLOAD PDF" required></textarea>
        <button type="submit">> DECRYPT MANUAL ENTRY</button>
    </form>

    <div id="resultBox" class="result-box">
        <span id="statusText"></span>
        <div id="dataContainer" class="verified-data" style="display: none;">
            <strong style="color: var(--neon-green);">> SECURE PAYLOAD EXTRACTED:</strong><br><br>
            <span id="verifiedData"></span>
        </div>
    </div>
</div>

<script>
    // Setup PDF Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const qrContentBox = document.getElementById("qrContent");
    const readerDiv = document.getElementById("reader");
    const startScanBtn = document.getElementById("startScanBtn");
    const stopScanBtn = document.getElementById("stopScanBtn");
    const uploadPdfBtn = document.getElementById("uploadPdfBtn");
    const pdfFileInput = document.getElementById("pdfFileInput");
    let html5QrcodeScanner;

    // --- 1. NEW: PDF UPLOAD & EXTRACTION LOGIC ---
    uploadPdfBtn.addEventListener("click", () => {
        pdfFileInput.click();
    });

    pdfFileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file || file.type !== "application/pdf") return;

        qrContentBox.value = "[ EXTRACTING SYSTEM DATA FROM PDF... PLEASE WAIT ]";

        const fileReader = new FileReader();
        fileReader.onload = async function() {
            try {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                const page = await pdf.getPage(1);

                // Render the PDF to an invisible canvas
                const viewport = page.getViewport({ scale: 2.0 }); // High-res for QR scanning
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                // Tell jsQR to scan the invisible canvas for the matrix
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    qrContentBox.value = code.data;
                    verifySecureData(code.data); // Auto-verify!
                } else {
                    qrContentBox.value = "";
                    alert("[ ERROR: NO CRYPTOGRAPHIC QR CODE DETECTED IN PDF ]");
                }
            } catch (err) {
                alert("[ FATAL: PDF PARSING FAILED ]");
            }
            pdfFileInput.value = ""; // Reset file input
        };
        fileReader.readAsArrayBuffer(file);
    });

    // --- 2. CAMERA SCANNER LOGIC ---
    startScanBtn.addEventListener("click", () => {
        readerDiv.style.display = "block";
        startScanBtn.style.display = "none";
        stopScanBtn.style.display = "block";

        html5QrcodeScanner = new Html5Qrcode("reader");

        html5QrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: {width: 250, height: 250} },
            (decodedText, decodedResult) => {
                html5QrcodeScanner.stop();
                readerDiv.style.display = "none";
                startScanBtn.style.display = "block";
                stopScanBtn.style.display = "none";

                qrContentBox.value = decodedText;
                verifySecureData(decodedText);
            },
            (errorMessage) => {}
        ).catch((err) => {
            alert("CAMERA ERROR: Please ensure webcam permissions are granted.");
        });
    });

    stopScanBtn.addEventListener("click", () => {
        if (html5QrcodeScanner) html5QrcodeScanner.stop();
        readerDiv.style.display = "none";
        startScanBtn.style.display = "block";
        stopScanBtn.style.display = "none";
    });

    // --- 3. DECRYPTION LOGIC ---
    document.getElementById("verifyForm").addEventListener("submit", (e) => {
        e.preventDefault();
        verifySecureData(qrContentBox.value);
    });

    async function verifySecureData(qrContent) {
        const resultBox = document.getElementById("resultBox");
        const statusText = document.getElementById("statusText");
        const dataContainer = document.getElementById("dataContainer");
        const verifiedData = document.getElementById("verifiedData");

        resultBox.style.display = "none";

        try {
            const response = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qrContent })
            });

            const data = await response.json();
            resultBox.style.display = "block";

            if (data.status === "VALID") {
                resultBox.className = "result-box valid";
                statusText.innerText = "[ VERIFIED: RSA SIGNATURE AUTHENTIC ]";
                dataContainer.style.display = "block";
                verifiedData.innerText = data.verifiedData;
            } else {
                resultBox.className = "result-box invalid";
                statusText.innerText = "[ ALERT: SIGNATURE TAMPERED OR INVALID ]";
                dataContainer.style.display = "none";
            }
        } catch (err) {
            alert("Server error connecting to verification API.");
        }
    }
</script>
</body>
</html>
