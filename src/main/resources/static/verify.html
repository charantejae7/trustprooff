<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Certificate</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; }
        textarea { width: 100%; max-width: 500px; height: 150px; margin-bottom: 10px; }
        button { padding: 10px 20px; background-color: #2563eb; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; background: #f3f4f6; max-width: 500px; }
    </style>
</head>
<body>
<h2>Paste QR Data Here:</h2>
<textarea id="qrInput" placeholder="Paste DATA and SIGNATURE here..."></textarea><br>

<button onclick="sendData()">Verify Certificate</button>

<div id="result">Waiting for input...</div>

<script>
    async function sendData() {
        const rawText = document.getElementById("qrInput").value.trim();
        const resultBox = document.getElementById("result");

        if (!rawText) {
            alert("Please paste the data first!");
            return;
        }

        resultBox.innerHTML = "Processing...";

        try {
            // This exact path matches the @PostMapping in your Java file!
            const response = await fetch("/api/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ qrContent: rawText })
            });

            const data = await response.json();

            // Display the JSON response directly on the screen
            resultBox.innerHTML = "<strong>Status: " + data.status + "</strong><br><br>" +
                                  "Message: " + data.message + "<br><br>" +
                                  (data.verifiedData ? "Data: " + data.verifiedData : "");
        } catch (err) {
            resultBox.innerHTML = "Error connecting to server.";
        }
    }
</script>
</body>
</html>
